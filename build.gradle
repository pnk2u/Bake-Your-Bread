static List<Integer> previousMcVersion(int major, int minor, int patch) {
	def maxForMajor = { int m ->
		if (m == 1) {
			return [21, 11] // 1.21.11 is the ceiling for major=1
		}
		if (m >= 26) {
			return [52, 52] // 52 for <53 calendar weeks in a year
		}
		return [21, 11]
	}

	if (major > 1 && (major < 26 || major == 26 && minor == 1 && patch == 0)) {
		return [1, 21, 11]
	}

	if (patch > 0) {
		return [major, minor, patch - 1]
	}

	// patch == 0: move to previous minor
	if (minor > 0) {
		def (_, maxPatch) = maxForMajor(major)
		return [major, minor - 1, maxPatch]
	}

	// minor == 0 and patch == 0: move to previous major
	if (major <= 1) {
		return [1, 0, 0]
	}

	int newMajor = major - 1
	if (newMajor > 1 && newMajor < 26) {
		// Skip 2..25 and go directly to 1.21.11
		return [1, 21, 11]
	}

	def (maxMinor, maxPatch) = maxForMajor(newMajor)
	return [newMajor, maxMinor, maxPatch]
}

def getReleaseVersion(minecraftVersion) {
	// Truncate version after first non-integer/dot
	def releaseVersion = minecraftVersion.replaceAll(/[^0-9.].*/, '')
	if (minecraftVersion != releaseVersion) {println('==='); println('Resolved \"' + minecraftVersion + '\" as \"' + releaseVersion + '\" for Fabric and Parchment.');
		println('===')}
	return releaseVersion
}

def releaseVersion = getReleaseVersion(minecraft_version)

def getLatestFabric(minecraftVersion) {
	def fApiXmlUrl = 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml'
	def fLoaderJsonUrl = 'https://meta.fabricmc.net/v2/versions/loader'

	def fLoaderJson = new JsonSlurper().parseText(new URI(fLoaderJsonUrl).toURL().text)
	def fLoaderLatestVersion = fLoaderJson.get(0).version
	println('Fabric Loader: ' + fLoaderLatestVersion)

	def fApiLatestVersion
	try {
		def metadata = new XmlSlurper().parse(fApiXmlUrl)
		def versions = metadata.versioning.versions.version*.text()
		fApiLatestVersion = versions.findAll { it ==~ /\d+(\.\d+)*.${minecraftVersion}/ }.last()
		println('Fabric Api: ' + fApiLatestVersion)
	} catch (Exception e) {
		throw new GradleException("Failed to fetch $fApiXmlUrl: ${e.message}")
	}
	return [fLoaderLatestVersion, fApiLatestVersion]
}

def getParchmentWithDecrementedMC(minecraftVersion) {
	def url = 'https://versioning.parchmentmc.org/versions'
	def response
	try {
		response = new URI(url).toURL().text
		if (response.length() < 100) throw new Exception("Response too short")
	} catch (Exception e) {
		println "Loading local fallback due to: ${e.message}"
		response = new File("../../resources/versioning.parchmentmc.org/versions").text
	}
	def json = new JsonSlurper().parseText(response)
	def releases = json['releases']

	// Truncate version after first non-integer/dot
	def releaseVersion = minecraftVersion.replaceAll(/[^0-9.].*/, '')

	def versionParts = releaseVersion.toString().split('\\.') as List
	if (versionParts.size() == 2) versionParts << "0"
	if (versionParts.size() < 2 || versionParts.size() > 3) throw new GradleException("Invalid Minecraft version format: $minecraftVersion")
	def (rMaj, rMin, rPat) = versionParts.collect {it as Integer}
	def (int dMaj, int dMin, int dPat) = previousMcVersion(rMaj, rMin, rPat)
	def decrementedVersion = "${dMaj}.${dMin}.${dPat}"

	def allVersions = releases.keySet().collect { String key ->
		def parts = key.split('\\.')
		if (parts.length == 2) {
			parts = [parts[0], parts[1], "0"]
		} else if (parts.length != 3) {
			throw new GradleException("Unexpected Parchment MC version format in releases: ${key}")
		}
		def maj = parts[0] as int
		def min = parts[1] as int
		def pat = parts[2] as int
		[major: maj, minor: min, patch: pat, key: key]
	}.sort { a, b ->
		if (a.major != b.major) return a.major <=> b.major
		if (a.minor != b.minor) return a.minor <=> b.minor
		return a.patch <=> b.patch
	}

	if (allVersions.isEmpty()) {
		throw new GradleException("Unable to find any Parchment versions from releases.")
	} else if(logger.isEnabled(LogLevel.INFO)) {
		println("All Parchment versions found in ${url}:")
		allVersions.each { v ->
			println("  - ${v.key}")
		}
	}

	def found = null
	for (int i = allVersions.size() - 1; i >= 0; i--) {
		def v = allVersions[i]
		if (v.major < rMaj ||
				(v.major == rMaj && v.minor < rMin) ||
				(v.major == rMaj && v.minor == rMin && v.patch <= rPat)) {
			found = v
			break
		}
	}

	if (found == null) {
		throw new GradleException("No valid Parchment version found for $minecraftVersion or earlier.")
	}

	def parchmentKey = found.key
	def parchmentDate = releases[parchmentKey]
	logger.print("Parchment: " + parchmentKey + " + " + parchmentDate as String + "\n")
	return [decrementedVersion, parchmentKey, parchmentDate]
}

def (fabric_loader_version, fabric_api_version) = getLatestFabric(releaseVersion)
def (decrementedVersion, pMinecraftVersion, mostRecentParchmentDate) = getParchmentWithDecrementedMC(releaseVersion)

dependencies {
